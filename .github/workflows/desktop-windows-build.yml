name: Desktop (Windows build)

# Every push to `dev` that could change the till builds a Windows installer and attaches
# it to the run as a downloadable artefact. It does NOT create a release: that is what
# tags are for (see release.yml). This answers "does my change still build and install on
# Windows?" without spending a version number.
#
# It also dry-runs the release publish path (flatten + checksum, via
# `scripts/release-assets.sh`), because the release workflow only runs on a tag, where its
# YAML is frozen at the tagged commit and therefore cannot be tested by editing `dev`.
#
# The full gate suite (lint, typecheck, unit, e2e, counter audit) is the `Desktop`
# workflow; this one is deliberately build-only so a push stays cheap.

on:
  push:
    branches: [dev]
    paths:
      - 'desktop/**'
      - 'packages/**'
      - 'scripts/release-assets.sh'
      - 'bun.lock'
      - 'tsconfig.base.json'
      - '.github/workflows/desktop-windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows installer (unsigned)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Squirrel installer
        run: bun run make:pos -- --platform win32 --arch x64

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: pos-windows-${{ github.sha }}
          path: |
            desktop/out/make/**/*.exe
            desktop/out/make/**/*.nupkg
            desktop/out/make/**/RELEASES
          if-no-files-found: error
          retention-days: 14

  # The `Release` workflow only runs on a tag, where its YAML is frozen at the tagged
  # commit. A broken publish step would otherwise stay invisible until someone cut a
  # version. This runs the same flatten/checksum script against the installer built above,
  # so the failure surfaces on a push to `dev`.
  publish-check:
    name: Release assets (dry run)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Download installer
        uses: actions/download-artifact@v7
        with:
          name: pos-windows-${{ github.sha }}
          path: release-assets

      - name: Flatten and checksum
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release-assets.sh release-assets dist

          # The publish step uploads `dist/*`, so prove the set is exactly what the
          # release notes promise: one installer, one package, one Squirrel feed.
          test "$(find dist -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.nupkg' | wc -l)" -eq 1
          test -f dist/RELEASES
          test -f dist/SHA256SUMS.txt
          echo "Release assets are publishable."
