name: Release

# Publish the Windows installer to GitHub Releases, so a till can be installed from a
# download link instead of a local build. Linux is not published: the till fleet is
# Windows, and every extra artefact is another thing to keep working.
#
# Prefer Actions → Release → Run workflow with the version you want, for example v0.1.0.
# That path builds `dev` as it stands, then creates the tag as the last step, so the tag
# only exists once an installer has actually been published, and it points at the commit
# that produced it. Fixing a failed run means re-dispatching: there is no tag to move.
#
# Pushing a tag by hand still works, but remember that a tag resolves this file at the
# tagged commit, not on `dev`. A fix to this workflow therefore does not apply to a tag
# cut before it, which is exactly the trap the dispatch path avoids.
#
# A push to `dev` that touches the desktop builds an installer as a downloadable workflow
# artefact (desktop-windows-build.yml), alongside a dry run of the flatten and checksum
# steps below, so a broken publish path fails on a push rather than at release time.
#
# Build gates (lint, typecheck, unit tests, e2e, counter audit) live in `Desktop`
# (.github/workflows/desktop.yml). Run that when the code changed; this workflow only
# builds and publishes.
#
# The installer is UNSIGNED until the code-signing certificate lands (Phase 15), and
# there is no auto-update yet.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0. Must match desktop/package.json; created at the built commit if absent.'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Squirrel requires a Windows host; Wine on Linux is not supported for this maker.
      - name: Build Squirrel installer
        run: bun run make:pos -- --platform win32 --arch x64

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            desktop/out/make/**/*.exe
            desktop/out/make/**/*.nupkg
            desktop/out/make/**/RELEASES
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `gh` resolves the repository through the local git remote and exits with
      # "fatal: not a git repository" without a checkout. The code is already built, but
      # the checkout also anchors a tag that `gh release create` has to make for a
      # workflow_dispatch run: without it the tag would land on the wrong commit.
      - uses: actions/checkout@v7

      # The upload keeps the Squirrel layout (`squirrel.windows/x64/...`), so the
      # downloaded tree is nested. Flatten it into `dist/` first: a release asset list
      # must be files, and `sha256sum`/`gh release upload` fail on directories.
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Flatten and checksum assets
        shell: bash
        run: bash scripts/release-assets.sh release-assets dist

      - name: Resolve tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *) TAG="v$TAG" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      # Guard the two ways a release can name the wrong code:
      #   - a version that disagrees with package.json, which would publish a release
      #     whose installer carries a different number than its tag;
      #   - an existing tag at another commit, which is what a workflow_dispatch from a
      #     newer `dev` looks like. Failing here is deliberate: the alternative is a
      #     release that silently describes one commit and ships the installer of another.
      - name: Guard tag
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '"version"' desktop/package.json \
            | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match desktop/package.json version $version. The installer would be named $version."
            exit 1
          fi

          head=$(git rev-parse HEAD)
          # `^{}` peels an annotated tag to its commit; a lightweight tag has no peeled ref.
          tagged=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)
          if [ -z "$tagged" ]; then
            tagged=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          fi
          if [ -n "$tagged" ] && [ "$tagged" != "$head" ]; then
            echo "::error::Tag $TAG already points at $tagged, but this run built $head. Move the tag, or release a new version."
            exit 1
          fi
          echo "Tag $TAG is consistent with $head at version $version."

      - name: Write release notes
        shell: bash
        run: |
          cat > NOTES.md <<'EOF'
          The Windows till installer, unsigned while the signing certificate is pending.

          ## Install

          1. Download `Sceptre Drive POS-<version> Setup.exe` (the only `.exe` asset).
          2. Windows SmartScreen will warn because the installer is unsigned —
             **More info → Run anyway**.
          3. Before the first launch, put `config.json` in `%APPDATA%\Sceptre Drive POS\`.
          4. Enrol from the console (terminals → enrolment code) and set a staff PIN.

          ## config.json

          ```json
          {
            "apiBaseUrl": "https://<your-api>.onrender.com",
            "powersyncUrl": "https://<your-instance>.powersync.journeyapps.com"
          }
          ```

          A packaged build refuses `localhost` unless `SCEPTRE_ALLOW_LOCAL_API=1`, so a wrong
          URL fails loudly rather than selling into a development API.

          `SHA256SUMS.txt` lists the checksums of every asset.

          Unsigned, no auto-update. Signing, auto-update and the production cut are Phase 15.
          EOF

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; re-uploading assets."
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file NOTES.md
          else
            # --target pins the tag to the commit this run built. Without it, gh creates
            # a missing tag on the repository's default branch, which is not necessarily
            # the commit the installer came from.
            gh release create "$TAG" dist/* \
              --target "$HEAD_SHA" \
              --title "Sceptre Drive POS $TAG" \
              --notes-file NOTES.md
          fi
