name: Release

# Publish the Windows installer to GitHub Releases, so a till can be installed from a
# download link instead of a local build. Linux is not published: the till fleet is
# Windows, and every extra artefact is another thing to keep working.
#
# Asset names are normalised before upload (`scripts/release-assets.sh`): GitHub rewrites
# filenames containing spaces, which would leave SHA256SUMS.txt and the install notes pointing
# at a name the Releases page does not list.
#
# Prefer Actions → Release → Run workflow with the version you want, for example 0.2.0.
# That path validates the number, stamps it into `desktop/package.json` for the build so
# the installer carries it, and creates the tag `v0.2.0` as the last step, pinned to the
# commit it built. Nothing is bumped by hand, and the tag only exists once an installer has
# actually been published, so fixing a failed run means re-dispatching: there is no tag to move.
#
# Pushing a tag by hand still works (the version comes from the tag), but remember that a
# tag resolves this file at the tagged commit, not on `dev`. A fix to this workflow
# therefore does not apply to a tag cut before it, which is exactly the trap the dispatch
# path avoids.
#
# A push to `dev` that touches the desktop builds an installer as a downloadable workflow
# artefact (desktop-windows-build.yml), alongside a dry run of the flatten and checksum
# steps below, so a broken publish path fails on a push rather than at release time.
#
# Build gates (lint, typecheck, unit tests, e2e, counter audit) live in `Desktop`
# (.github/workflows/desktop.yml). Run that when the code changed; this workflow only
# builds and publishes.
#
# The installer is UNSIGNED until the code-signing certificate lands (Phase 15), and
# there is no auto-update yet.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to ship, for example 0.2.0. Leave blank to bump the patch of the newest tag.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolve and validate the version before anything expensive runs, so a typo fails in
  # seconds instead of after a ten-minute Windows build.
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The newest published tag is the real floor: desktop/package.json stops
          # advancing once releases start, because the stamp is build-local.
          latest=$(git ls-remote --tags --refs origin 'refs/tags/v*' \
            | sed -E 's#.*refs/tags/v##' \
            | sort -V \
            | tail -n 1)

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
            version="${version// /}"
          else
            # A tag push: `v0.2.0` -> `0.2.0`.
            version="${GITHUB_REF_NAME#v}"
          fi

          # A dispatched run may omit the version, in which case the next patch is the
          # obvious choice: the operator picks "release", not a number, and the decision that
          # needs a human (minor or major) stays explicit.
          if [ -z "$version" ]; then
            if [ -z "$latest" ]; then
              version="0.1.0"
            else
              base="${latest%%-*}"
              version=$(printf '%s' "$base" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 + 1 }')
            fi
            echo "No version given; bumping the newest tag ($latest) to $version."
          fi

          # Validates the shape and refuses a version lower than the committed one or the
          # newest tag.
          if [ -n "$latest" ]; then
            node scripts/set-release-version.mjs "$version" --check --floor "$latest"
          else
            node scripts/set-release-version.mjs "$version" --check
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer
    needs: [prepare]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The installer is named from desktop/package.json, so stamp the version the release
      # asked for before Forge reads it. This is build-local: the committed file is not
      # touched, and the tag records what shipped.
      - name: Stamp release version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/set-release-version.mjs "$VERSION"

      # Squirrel requires a Windows host; Wine on Linux is not supported for this maker.
      - name: Build Squirrel installer
        run: bun run make:pos -- --platform win32 --arch x64

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            desktop/out/make/**/*.exe
            desktop/out/make/**/*.nupkg
            desktop/out/make/**/RELEASES
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `gh` resolves the repository through the local git remote and exits with
      # "fatal: not a git repository" without a checkout. The code is already built, but
      # the checkout also anchors a tag that `gh release create` has to make for a
      # workflow_dispatch run: without it the tag would land on the wrong commit.
      - uses: actions/checkout@v7

      # The upload keeps the Squirrel layout (`squirrel.windows/x64/...`), so the
      # downloaded tree is nested. Flatten it into `dist/` first: a release asset list
      # must be files, and `sha256sum`/`gh release upload` fail on directories.
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Flatten and checksum assets
        shell: bash
        run: bash scripts/release-assets.sh release-assets dist

      # The version shape and the no-downgrade rule were already checked by `prepare`, and
      # the installer was built from the stamped version. The remaining hazard is a tag
      # that already points at a different commit: publishing then would produce a release
      # describing one commit and shipping the installer of another.
      - name: Guard tag
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          # `^{}` peels an annotated tag to its commit; a lightweight tag has no peeled ref.
          tagged=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)
          if [ -z "$tagged" ]; then
            tagged=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          fi
          if [ -n "$tagged" ] && [ "$tagged" != "$head" ]; then
            echo "::error::Tag $TAG already points at $tagged, but this run built $head. Release a new version."
            exit 1
          fi
          echo "Tag $TAG is free, or already at $head."

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          # The installer name is read from the built set rather than composed from the
          # version, so the notes cannot drift from the asset that was uploaded.
          shopt -s nullglob
          installers=(dist/*.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .exe asset, found ${#installers[@]}."
            exit 1
          fi
          sed "s|@INSTALLER@|$(basename "${installers[0]}")|g" scripts/release-notes.md > NOTES.md

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; re-uploading assets."
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file NOTES.md
          else
            # --target pins the tag to the commit this run built. Without it, gh creates
            # a missing tag on the repository's default branch, which is not necessarily
            # the commit the installer came from.
            gh release create "$TAG" dist/* \
              --target "$HEAD_SHA" \
              --title "Sceptre Drive POS $TAG" \
              --notes-file NOTES.md
          fi

          # The release is owned by this workflow, so anything left over from an earlier run
          # (a name GitHub rewrote, a superseded installer) is removed. Otherwise the page
          # lists two installers while SHA256SUMS.txt describes only one.
          keep=" $(find dist -maxdepth 1 -type f -printf '%f\n' | tr '\n' ' ') "
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            case "$keep" in
              *" $name "*) ;;
              *)
                echo "Removing stale asset: $name"
                gh release delete-asset "$TAG" "$name" --yes
                ;;
            esac
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')

      # A release can look finished while an asset is unusable. A 502 during upload leaves
      # an empty placeholder with `state: starter`, which the Releases page still lists but
      # no browser will download, and nothing in the upload call reports it. So download
      # the assets back through the API and compare them byte for byte, rather than
      # trusting that the upload returned success.
      - name: Verify published assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p verify
          gh release download "$TAG" --dir verify
          ls -la verify

          for file in dist/*; do
            name=$(basename "$file")
            if [ ! -f "verify/$name" ]; then
              echo "::error::$name is listed on the release but cannot be downloaded."
              exit 1
            fi
            if ! cmp --silent "$file" "verify/$name"; then
              echo "::error::$name does not match what was uploaded (truncated or replaced)."
              exit 1
            fi
          done
          echo "Every asset downloads back byte for byte."
