name: CI

on:
  pull_request:
  push:
    branches: [dev, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sceptre_drive
          POSTGRES_PASSWORD: sceptre_drive
          POSTGRES_DB: sceptre_drive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sceptre_drive -d sceptre_drive_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sceptre_drive:sceptre_drive@localhost:5432/sceptre_drive_test
      TEST_DATABASE_URL: postgresql://sceptre_drive:sceptre_drive@localhost:5432/sceptre_drive_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-32ch
      VITE_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Brand check
        run: bun run brand:check

      - name: Typecheck
        run: bun run check-types

      - name: Migrate database
        run: bun run db:migrate

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
